<style>

.tabs button .ic{width:9px;height:9px;border-radius:50%;background:var(--tc);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.tabs button.on{background:var(--soft);color:var(--ac2);box-shadow:0 -3px 0 var(--ac) inset}
main{flex:1;overflow:auto;max-width:none;width:100%;margin:0;padding:22px 28px 30px;background:var(--soft)}
main>#v{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}

button{cursor:pointer}button:hover{border-color:var(--ac);color:var(--ac2)}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover,button.on:hover{background:var(--ac2);color:#fff}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--ac) 18%,var(--bd));border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.card>b:first-child{color:var(--ac2)}
table{border-collapse:collapse;width:100%}
th{background:var(--soft);color:var(--ac2)!important;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:color-mix(in srgb,var(--ac) 5%,#fff)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}

.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kp b{display:block;font-size:18px;color:var(--ac)}
.ph{display:none}
a.lk{color:var(--ac);font-weight:600;text-decoration:underline dotted;cursor:pointer}a.lk:hover{text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(15,23,32,.55);z-index:50;overflow:auto;padding:16px}
.md{background:var(--bg);max-width:760px;margin:0 auto;border-radius:14px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}

.big{border-radius:12px;padding:14px;margin-bottom:12px;color:#fff;font-weight:600}.big.ok{background:var(--ac)}.big.no{background:var(--bad)}.big small{display:block;font-weight:400;opacity:.92;margin-top:2px}

.chip.Paid{background:#dcf5e6;color:#0b6b3a}.chip.Part{background:#fff1d6;color:#8a5a00}.chip.Unpaid{background:#fde4e1;color:#b42318}.chip.Bereaved{background:#e8ecf1;color:#475467}

input[type=checkbox]{width:auto;padding:0}

</style></head><body>
<header><div class="logo">LCA</div><div class="t"><b>FULL GOSPEL CHURCHES OF KENYA</b><b>MURANG'A TOWN LCA WELFARE GROUP</b><span>Registration, Cases &amp; Contributions (Paybill)</span></div></header>
<div class="tabbar"><div class="tabs" id="tabs"></div></div>
<main><div id="v"></div></main>
<script>const SEED={"reg":[],"cases":[]};</script>
<script>
// optional: Excel support when online
(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onerror=function(){};document.head.appendChild(s)})();
const K='lca_welfare_v1';let S={members:[],tx:[]};
try{const x=localStorage.getItem(K);if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='reg',av='fam',q='',msg='',sel='',yr='',mo='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
const memName=a=>(S.members.find(m=>m.acc===a)||{}).name||famName(a);
function famName(a){const k=nu(a),g=groups().find(g=>g.u&&nu(g.u)===k);return g?hf(g.r).map(m=>m.n.trim()).join(' & '):''}
function famByAcc(a){const k=nu(a);return groups().find(g=>g.u&&nu(g.u)===k)}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2=n=>String(n).padStart(2,'0');

function csv(text){const rows=[];let r=[],c='',q=false;text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch=='"'){if(text[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&text[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
function parseTime(v){
  if(v instanceof Date)return v;
  if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d,d.H,d.M,d.S)}
  const s=String(v).trim();let m;
  if(m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T]+(\d{1,2}):(\d{2}):?(\d{2})?/))return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  if(m=s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})[ T]*(\d{1,2})?:?(\d{2})?:?(\d{2})?/))return new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))return new Date(+m[1],m[2]-1,+m[3]);
  const d=new Date(s);return isNaN(d)?null:d}
const norm=h=>String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function pick(row,keys){for(const k in row){const n=norm(k);if(keys.some(x=>n===x||n.includes(x)))return row[k]}return ''}
function rowToTx(r){
  const ref=String(pick(r,['receiptno','receipt','transactionid','reference','ref'])).trim().toUpperCase();
  const dt=parseTime(pick(r,['completiontime','transactiontime','date','time']));
  const amt=parseFloat(String(pick(r,['paidin','amount','credit'])).replace(/,/g,''));
  const details=String(pick(r,['details','description']));
  const other=String(pick(r,['otherpartyinfo','msisdn','phone','sender']));
  let acc=String(pick(r,['acno','accountno','accountnumber','billrefnumber','account'])).trim();
  if(!acc){const m=details.match(/Acc(?:ount)?\.?\s*(?:No\.?)?\s*[:\-]?\s*(\S+)/i);if(m)acc=m[1]}
  const ph=(other+' '+details).match(/(?:\+?254|0)[71][\d*]{8}/);
  if(!ref||!dt||!(amt>0))return null;
  return{ref,date:`${dt.getFullYear()}-${p2(dt.getMonth()+1)}-${p2(dt.getDate())}`,time:`${p2(dt.getHours())}:${p2(dt.getMinutes())}:${p2(dt.getSeconds())}`,amount:amt,phone:ph?ph[0]:'',acc:(/^\d{1,3}$/.test(acc.trim())?acc.trim().padStart(3,'0'):acc.toUpperCase())}}
function ingest(a){
  let h=a.findIndex(r=>r.some(c=>/receipt|transaction\s*id|reference/i.test(c)));if(h<0)h=0;
  const hd=a[h],rows=a.slice(h+1).map(r=>Object.fromEntries(hd.map((k,i)=>[k||('c'+i),r[i]])));
  const seen=new Set(S.tx.map(t=>t.ref));let add=0,dup=0,skip=0,sum=0;
  for(const r of rows){const t=rowToTx(r);if(!t){skip++;continue}
    if(seen.has(t.ref)){dup++;continue}seen.add(t.ref);S.tx.push(t);add++;sum+=t.amount}
  S.tx.sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));save();
  msg=`Imported ${add} new payment(s) worth KES ${fmt(sum)}. Duplicates ignored: ${dup}. Rows skipped (not payments in): ${skip}.`+unmatchedMsg();render()}
function unmatchedMsg(){const u=[...new Set(S.tx.filter(t=>!famByAcc(t.acc)&&!S.members.some(m=>m.acc===t.acc)).map(t=>t.acc||'(blank)'))];return u.length?` ${u.length} account number(s) match no unit or member: ${u.slice(0,15).join(', ')}${u.length>15?' …':''}. Check these on the Payments tab.`:' Every payment matched a unit.'}
async function importFile(f){
  if(!f)return;
  if(/\.xls/i.test(f.name)){
    if(!window.XLSX){msg='Excel files need internet on first use. Open the file in Excel, choose Save As > CSV, and import the CSV.';render();return}
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    ingest(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}))}
  else ingest(csv(await f.text()))}

const TH={reg:['#0b6b3a','#084d2a','#e6f3ec'],cas:['#6d3fb0','#4b2784','#efe9f8'],mem:['#0a6c8f','#07496a','#e4f1f6'],imp:['#c2570c','#8f3d05','#fbeee1'],pay:['#1d4ed8','#14338f','#e6edfb'],ana:['#a3185a','#730f40','#f8e7f0'],rem:['#128c7e','#075e54','#e3f5f1'],bak:['#475467','#2b3440','#eceff3']};
const TL=[['reg','Registration'],['cas','Cases'],['mem','Members'],['imp','Import'],['pay','Payments'],['ana','Analysis'],['rem','Reminders'],['bak','Backup']];
function theme(){const t=TH[tab]||TH.reg,r=document.documentElement.style;r.setProperty('--ac',t[0]);r.setProperty('--ac2',t[1]);r.setProperty('--soft',t[2])}
function render(){theme();
  $('#tabs').innerHTML=TL.map(([k,l])=>`<button class="${tab===k?'on':''}" style="--tc:${TH[k][0]}" onclick="tab='${k}';render()"><span class="ic"></span>${l}</button>`).join('');
  $('#v').innerHTML=(!S.reg.length&&tab!=='bak'?'<div class="card"><b>No data on this phone yet</b><p>Open the <b>Backup</b> tab and use <b>Restore</b> to load the backup file from the computer.</p><button class="p" onclick="tab=\'bak\';render()">Go to Backup</button></div>':'')+({reg:regv,cas:casv,mem,imp,pay,ana,rem:remv,bak})[tab]();$('#v').style.maxWidth=tab==='reg'?'none':''}

function allocG(g){const h=g.r[0],ids=g.r.map(m=>m.id),C=S.cases,n=C.length;
 const A=C.map(c=>{const ber=ids.some(i=>c.b.includes(i));const raw=ids.reduce((x,i)=>x+(c.pay[i]||0),0);return{ber,exp:ber?0:rate(c,h),raw,eff:raw,out:[],inn:[]}});
 for(let j=0;j<n;j++){const a=A[j];if(a.ber)continue;let sur=a.eff-a.exp;if(sur<=0)continue;
  for(let k=j-1;k>=0&&sur>0;k--){const b=A[k];if(b.ber)continue;const need=b.exp-b.eff;if(need<=0)continue;const t=Math.min(sur,need);
   b.eff+=t;a.eff-=t;sur-=t;a.out.push({to:C[k].n,amt:t});b.inn.push({from:C[j].n,amt:t})}}
 return A}

  return{n:c.n,d:c.d,s,paid,exp:ber?0:exp,bal:ber?0:Math.max(0,exp-paid),extra:ber?0:Math.max(0,paid-exp),note:noteOf(a)}});
 const due=rows.filter(r=>r.s!='Bereaved'),tot=rows.reduce((a,r)=>a+r.paid,0),out=rows.reduce((a,r)=>a+r.bal,0);
 const un=g.u?String(+g.u||g.u):'';
 const tx=g.u?S.tx.filter(t=>String(+t.acc||t.acc)===un):[];
 return{g,h,names:hf(g.r).map(m=>m.n.trim()),rows,tot,out,cnt:due.filter(r=>r.s=='Paid'||r.s=='Part'||r.paid>0).length,due:due.length,fam:g.r.length>1,tx}}
const today=()=>new Date().toLocaleDateString('en-KE',{day:'numeric',month:'long',year:'numeric'});
const LBL={Paid:'Paid',Part:'Part paid',Unpaid:'Not paid',Bereaved:'Bereaved (exempt)'};
function profile(d){const R=hf(d.g.r),many=R.length>1,kids=[...new Set(R.flatMap(m=>m.k||[]))];
 const one=m=>{const ben=RC.map((l,k)=>m.s[k]?`<tr><td class="mu">${l}</td><td>${m.sd&&m.sd[k]?`<span class="dx" title="Deceased - no longer a beneficiary">† ${esc(m.s[k])}</span> <span class="mu">(deceased)</span>`:esc(m.s[k])}</td></tr>`:'').join('');
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:4px"><b class="${m.dd?'dn-d':''}">${m.dd?'† ':''}${esc(m.n)}</b><span>${m.dd?`<span class="chip dead">DECEASED †</span>`:'<span class="chip Paid">Active</span>'} <button class="xs noprint" onclick="closeStmt();tab='reg';editReg(${S.reg.indexOf(m)})">Edit</button></span></div>
  <table><tr><td class="mu">Role</td><td>${many?esc(m.ro||'Spouse'):'Member'}</td></tr>
  <tr><td class="mu">Unit no.</td><td>${esc(d.g.u)||'-'}</td></tr>
  <tr><td class="mu">Phone</td><td>${esc(m.p)||'-'}</td></tr>
  ${m.dd&&m.dt?`<tr><td class="mu">Date of passing</td><td>${esc(m.dt)}</td></tr>`:''}
  ${+m.f===100?'<tr><td class="mu">Rate</td><td>Reduced rate (KES 100)</td></tr>':''}
  ${m.t?`<tr><td class="mu">Note</td><td>${esc(m.t)}</td></tr>`:''}
  ${ben||'<tr><td class="mu">Spouse &amp; parents</td><td class="mu">None listed</td></tr>'}</table></div>`};
 return R.map(one).join('')+`<div class="card"><b>Children</b>${kids.length?`<div style="margin-top:4px">${kids.map(esc).join('<br>')}</div>`:'<div class="mu">None listed</div>'}</div>`}
function stmt(id){const d=sdata(id);if(!d)return;window.sid=id;
 const who=d.names.join(' & '),late=d.rows.filter(r=>r.bal>0);
 const big=d.out>0?`<div class="big no">Not yet up to date<small>${late.length} case(s) with a balance: KES ${fmt(d.out)} outstanding</small></div>`
  :`<div class="big ok">Up to date<small>Thank you for standing with the family in every case so far.</small></div>`;
 const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=e=>{if(e.target===o)closeStmt()};
 o.innerHTML=`<div class="md"><div class="ph"><b>FULL GOSPEL CHURCHES OF KENYA<br>MURANG'A TOWN LCA WELFARE GROUP</b></div>
 <div class="row noprint" style="justify-content:flex-end"><button class="p" onclick="stmtWA()">Send on WhatsApp</button><button onclick="stmtCopy()">Copy for WhatsApp</button><button onclick="print()">Print</button><button onclick="closeStmt()">Close</button></div>
 <h2>${d.g.r.length?hf(d.g.r).map(m=>m.dd?`<span class="dn-d">† ${esc(m.n.trim())}</span>`:esc(m.n.trim())).join(' &amp; '):esc(who)}</h2><div class="sub">${d.g.u?'Unit '+esc(d.g.u)+' · ':''}${d.fam?'Family (couple counted as one)':'Individual'}${d.h.p?' · '+esc(d.h.p):''} · Statement as at ${today()}</div>
 ${profile(d)}
 ${big}
 <div class="kp"><div>Total contributed<b>KES ${fmt(d.tot)}</b></div><div>Cases contributed to<b>${d.cnt} of ${d.due}</b></div><div>Outstanding<b class="${d.out?'bad':''}">KES ${fmt(d.out)}</b></div></div>
 <div class="card sc"><b>Contributions per case</b><table style="margin-top:6px"><tr><th>Case</th><th class="r">Expected</th><th class="r">Paid</th><th class="r">Balance</th><th>Status</th></tr>
 ${d.rows.map(r=>`<tr><td>${esc(r.n)}${r.d?` <span class="mu">${esc(r.d)}</span>`:''}${r.note.length?`<div class="mu">${r.note.map(esc).join('; ')}</div>`:''}</td><td class="r">${r.s=='Bereaved'?'-':fmt(r.exp)}</td><td class="r">${r.paid?fmt(r.paid):'-'}</td><td class="r ${r.bal?'bad':''}">${r.bal?fmt(r.bal):r.extra?'+'+fmt(r.extra)+' extra':'-'}</td><td><span class="chip ${r.s}">${LBL[r.s]}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mu">No cases yet.</td></tr>'}
 <tr><td><b>Total</b></td><td class="r"><b>${fmt(d.rows.reduce((a,r)=>a+r.exp,0))}</b></td><td class="r"><b>${fmt(d.tot)}</b></td><td class="r ${d.out?'bad':''}"><b>${d.out?fmt(d.out):'-'}</b></td><td></td></tr></table></div>
 ${d.tx.length?`<div class="card sc"><b>Paybill payments (account ${esc(d.g.u)})</b><table style="margin-top:6px"><tr><th>Date</th><th>Reference</th><th class="r">Amount</th></tr>${d.tx.map(t=>`<tr><td>${t.date}</td><td>${esc(t.ref)}</td><td class="r">${fmt(t.amount)}</td></tr>`).join('')}</table></div>`:''}
 <p class="mu">Expected amount is the standard amount for each case (KES 100 for members on the reduced rate). Bereaved families are exempt from the case. Contact the welfare treasurer if anything here looks wrong.</p></div>`;
 document.body.appendChild(o);document.body.classList.add('pm');document.body.style.overflow='hidden';o.scrollTop=0}
function closeStmt(){const o=$('#ov');if(o)o.remove();document.body.classList.remove('pm');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeStmt()});
function stmtText(id){const d=sdata(id||window.sid);if(!d)return'';
 const L=['*FGCK Murang\'a Town LCA Welfare Group*','Contribution statement for *'+d.names.join(' & ')+'*'+(d.g.u?' (Unit '+d.g.u+')':''),'As at '+today(),''];
 d.rows.forEach(r=>L.push((r.s=='Paid'?'✅ ':r.s=='Part'?'⚠️ ':r.s=='Bereaved'?'🕊️ ':'❌ ')+r.n+': '+(r.s=='Bereaved'?'bereaved (exempt)':r.s=='Unpaid'?'NOT PAID (KES '+fmt(r.exp)+' due)':'KES '+fmt(r.paid)+(r.bal?' – balance KES '+fmt(r.bal):''))+(r.note.length?' ('+r.note.join('; ')+')':'')));
 L.push('','Total contributed: KES '+fmt(d.tot));
 L.push(d.out>0?'Outstanding: *KES '+fmt(d.out)+'* – kindly clear when able. Thank you.':'You are up to date. God bless you for standing with us. 🙏');return L.join('\n')}
async function stmtCopy(){const t=stmtText();try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 alert('Copied. Open WhatsApp and paste to send to the member or the group.')}

// ===== WhatsApp reminders =====
const RTPL="Hello {name}, greetings from FGCK Murang'a Town LCA Welfare Group. 🙏\n\nOur records show an outstanding welfare contribution of *KES {amount}*:\n{cases}\n\nKindly pay via Paybill {paybill}, Account No. *{unit}*.\nIf you have already paid, please ignore this message or reply and we will check. Thank you, God bless you.";
let rcase='',rq2='';
const n0=n=>Number(n).toLocaleString('en-KE',{maximumFractionDigits:0});
function waNum(p){const d=String(p||'').replace(/\D/g,'');if(/^254[17]\d{8}$/.test(d))return d;if(/^0[17]\d{8}$/.test(d))return'254'+d.slice(1);if(/^[17]\d{8}$/.test(d))return'254'+d;return''}
function remList(){return groups().map(g=>{
  const act=hf(g.r).filter(m=>!m.dd);if(!act.length)return null;
  const h=g.r[0],d=sdata(h.id);if(!d)return null;
  const rows=d.rows.map((r,i)=>({...r,i})).filter(r=>r.bal>0&&(rcase===''||String(r.i)===rcase));
  if(!rows.length)return null;
  const raw=act.map(m=>String(m.p||'').trim()).filter(Boolean);
  return{key:g.u?'u'+g.u:'i'+h.id,u:g.u,h,rows,amt:rows.reduce((a,r)=>a+r.bal,0),
   names:act.map(m=>m.n.trim()).join(' & '),first:act.map(m=>m.n.trim().split(/\s+/)[0]).join(' & '),
   ph:act.map(m=>waNum(m.p)).find(Boolean)||'',raw:raw[0]||''}}).filter(Boolean)}
function hasWA(id){const g=grpOf(id);return !!g&&hf(g.r).some(m=>!m.dd&&waNum(m.p))}
function waFam(id){const sv=rcase;rcase='';const x=remList().find(y=>y.h.id===id);rcase=sv;let ph,txt;
 if(x){ph=x.ph;txt=remMsg(x)}else{const g=grpOf(id);if(!g)return;ph=hf(g.r).filter(m=>!m.dd).map(m=>waNum(m.p)).find(Boolean)||'';txt=stmtText(id)}
 if(!ph){alert('No valid phone number for this member. Add it on the Registration tab (Edit).');return}
 window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(txt),'_blank');
 if(x){S.rsent=S.rsent||{};S.rsent[x.key]={d:new Date().toISOString(),a:x.amt};save()}}
function waAcc(){const g=famByAcc(sel);if(g)return waFam(g.r[0].id);
 const L=S.tx.filter(t=>t.acc===sel),p=L.map(t=>waNum(t.phone)).find(Boolean);
 if(!p){alert('No phone number is known for this account.');return}
 const st=stats(L);window.open('https://wa.me/'+p+'?text='+encodeURIComponent("Hello "+(memName(sel)||'member')+", greetings from FGCK Murang'a Town LCA Welfare Group. 🙏 Our records show "+st.n+" contribution(s) from you totalling KES "+n0(st.s)+", the last on "+st.last+". Thank you, God bless you."),'_blank')}
function remMsg(x){return(S.rtpl||RTPL).replace(/\{name\}/g,()=>x.first).replace(/\{amount\}/g,()=>n0(x.amt))
  .replace(/\{cases\}/g,()=>x.rows.map(r=>'• '+r.n+': KES '+n0(r.bal)).join('\n'))
  .replace(/\{paybill\}/g,()=>S.rpb||'[Paybill no.]').replace(/\{unit\}/g,()=>x.u||'your unit number')}
function keepScroll(f){const m=document.querySelector('main'),t=m.scrollTop;f();m.scrollTop=t}
function openWA(key){const x=remList().find(y=>y.key===key);if(!x||!x.ph)return;
  window.open('https://wa.me/'+x.ph+'?text='+encodeURIComponent(remMsg(x)),'_blank');
  S.rsent=S.rsent||{};S.rsent[key]={d:new Date().toISOString(),a:x.amt};save();keepScroll(render)}
function nextWA(){const x=remList().find(y=>y.ph&&!(S.rsent&&S.rsent[y.key]));if(!x){alert('Everyone with a valid number has already been reminded.');return}openWA(x.key)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}}
async function copyWA(key){const x=remList().find(y=>y.key===key);if(!x)return;await copyText(remMsg(x));alert('Message copied. Paste it into WhatsApp.')}
function clearSent(){if(confirm('Clear all "reminded" marks?')){S.rsent={};save();render()}}
function stmtWA(){const d=sdata(window.sid);if(!d)return;const ph=hf(d.g.r).filter(m=>!m.dd).map(m=>waNum(m.p)).find(Boolean);
  if(!ph){alert('This member has no valid phone number on the Registration tab. Use "Copy for WhatsApp" instead.');return}
  window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(stmtText()),'_blank')}
function remv(){const L0=remList(),s=rq2.toLowerCase(),R=S.rsent||{};
 const L=L0.filter(x=>!s||(x.u+' '+x.names).toLowerCase().includes(s));
 const nonum=L0.filter(x=>!x.ph).length,tot=L0.reduce((a,x)=>a+x.amt,0),done=L0.filter(x=>R[x.key]).length,ex=L0.find(x=>x.ph)||L0[0];
 const dt=iso=>new Date(iso).toLocaleDateString('en-KE',{day:'numeric',month:'short'});
 return `<div class="kp"><div>Members owing<b>${L0.length}</b></div><div>Total outstanding<b class="bad">KES ${n0(tot)}</b></div><div>Reminded so far<b>${done} / ${L0.length}</b></div><div>No valid number<b class="${nonum?'bad':''}">${nonum}</b></div></div>
 <div class="card"><b>Message</b>
  <div class="mu" style="margin:6px 0">You can use {name} {amount} {cases} {unit} {paybill}. Each person only receives their own balance, so nobody's account is shown to the group.</div>
  <div class="row"><label class="dd">Paybill number <input value="${esc(S.rpb||'')}" placeholder="e.g. 123456" style="width:140px" onchange="S.rpb=this.value.trim();save();render()"></label>
  <label class="dd">Remind about <select onchange="rcase=this.value;render()"><option value="">All outstanding cases</option>${S.cases.map((c,i)=>`<option value="${i}" ${String(i)===rcase?'selected':''}>${esc(c.n)}</option>`).join('')}</select></label></div>
  ${S.rpb?'':'<div class="bad" style="margin-bottom:6px">Enter your paybill number so it appears in the message.</div>'}
  <textarea rows="7" style="width:100%" onchange="S.rtpl=this.value;save();render()">${esc(S.rtpl||RTPL)}</textarea>
  <div class="row" style="margin-top:6px"><button class="xs" onclick="S.rtpl='';save();render()">Reset message</button></div>
  ${ex?`<div class="mu" style="margin-top:8px">Preview (${esc(ex.names)}):</div><pre style="white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px;margin:4px 0 0;font:inherit">${esc(remMsg(ex))}</pre>`:''}</div>
 <div class="card"><div class="row noprint"><button class="p" onclick="nextWA()">Open WhatsApp for next member →</button><input placeholder="Search name or unit" value="${esc(rq2)}" oninput="rq2=this.value;keepScroll(()=>{const p=document.activeElement.selectionStart;render();const i=document.querySelector('main input[placeholder^=Search]');i.focus();i.setSelectionRange(p,p)})" style="flex:1;min-width:180px"><button onclick="clearSent()">Clear reminded marks</button></div>
 <div class="mu" style="margin-bottom:8px">WhatsApp opens with the message already typed. You only press Send. The member is then marked as reminded.</div>
 <div class="sc"><table><tr><th>Unit</th><th>Member(s)</th><th>Phone</th><th>Owing</th><th class="r">Amount</th><th>Reminded</th><th class="noprint"></th></tr>
 ${L.map(x=>`<tr><td>${esc(x.u)}</td><td>${nm({id:x.h.id},{h:esc(x.names)})}</td><td>${x.ph?esc(x.raw):x.raw?`<span class="bad">${esc(x.raw)} (invalid)</span>`:'<span class="bad">none</span>'}</td><td class="mu">${x.rows.map(r=>esc(r.n)).join(', ')}</td><td class="r"><b>${n0(x.amt)}</b></td><td>${R[x.key]?'✔ '+dt(R[x.key].d)+(R[x.key].a!==x.amt?' <span class="mu">(balance has changed)</span>':''):'<span class="mu">-</span>'}</td><td class="noprint"><button class="p xs" ${x.ph?'':'disabled'} onclick="openWA('${x.key}')">${R[x.key]?'Send again':'WhatsApp'}</button> <button class="xs" onclick="copyWA('${x.key}')">Copy</button></td></tr>`).join('')||'<tr><td colspan="7" class="mu">Nobody owes anything for this selection.</td></tr>'}</table></div>
 ${nonum?`<p class="mu">${nonum} member(s) have a missing or invalid number. Fix them on the Registration tab (Edit) and they will appear here ready to send.</p>`:''}</div>`}

render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
